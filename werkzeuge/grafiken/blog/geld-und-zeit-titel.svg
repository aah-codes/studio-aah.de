<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Titelbild Blog „Geld und Zeit“: Bauhaus-Grundformen. Uhr (Zeit) und Münzstapel (Geld). Farben laut CI. -->
  <rect width="1200" height="800" fill="#eeece7"/>
  <!-- Raster-Balken unten -->
  <rect x="0" y="700" width="1200" height="100" fill="#d6d8d9"/>
  <rect x="80" y="700" width="420" height="100" fill="#0e1011"/>
  <!-- Uhr: blauer Kreis, weißes Viertel = vergangene Zeit, schwarze Zeiger -->
  <circle cx="360" cy="380" r="250" fill="#2f6bff"/>
  <path d="M360 380 L360 130 A250 250 0 0 1 610 380 Z" fill="#fff"/>
  <rect x="348" y="170" width="24" height="222" fill="#0e1011"/>
  <rect x="348" y="368" width="170" height="24" fill="#0e1011"/>
  <circle cx="360" cy="380" r="30" fill="#0e1011"/>
  <!-- Münzstapel: schwarze Balken, Münze mit Euro -->
  <rect x="720" y="560" width="340" height="60" fill="#0e1011"/>
  <rect x="760" y="490" width="300" height="60" fill="#0e1011"/>
  <rect x="700" y="420" width="320" height="60" fill="#9a9d9e"/>
  <rect x="740" y="350" width="300" height="60" fill="#0e1011"/>
  <circle cx="900" cy="210" r="120" fill="#fff"/>
  <circle cx="900" cy="210" r="120" fill="none" stroke="#0e1011" stroke-width="24"/>
  <text x="900" y="262" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="150" fill="#0e1011">€</text>
  <!-- Dreieck als Akzent -->
  <path d="M1080 700 L1180 700 L1180 600 Z" fill="#0e1011"/>
  <!-- Halbkreis -->
  <path d="M600 700 A80 80 0 0 1 760 700 Z" fill="#2f6bff"/>
</svg>
